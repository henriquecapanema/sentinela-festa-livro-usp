name: Publicar página

# A página (site/) lê o indice.json direto do repo (raw.githubusercontent.com), então
# não precisa republicar a cada rodada do monitor: só quando a página muda.
# A cópia do indice.json que vai junto é o plano B, se o raw falhar.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar a página
        run: |
          mkdir _site
          cp -r site/. _site/
          cp indice.json _site/
          # versão nos links do CSS/JS: o navegador nunca mistura HTML novo com arquivo velho do cache
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html
          grep -o '?v=[^"]*' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
